name: merchant_voice_agent_app
description: "Merchant console for the Smart Merchant Payment App — mic in, PENDING transactions out."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Talking to the voice-agent backend
  http: ^1.2.0
  web_socket_channel: ^3.0.1

  # Microphone: streams raw PCM16 straight to the backend
  record: ^6.0.0
  permission_handler: ^12.0.0

  # Remembers the backend address between launches
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
